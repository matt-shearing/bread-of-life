name: Android APK

# Builds a signed Android APK and attaches it to a GitHub Release.
# Obtainium installs/updates directly from these Release assets.
#
# Trigger: push a tag like `v0.1.0`, or run manually (workflow_dispatch).
#
# Secrets required for a *signed* build (Settings → Secrets → Actions):
#   ANDROID_KEYSTORE_BASE64  – base64 of your release keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Generate one:
#   keytool -genkey -v -keystore bol.jks -keyalg RSA -keysize 2048 \
#     -validity 10000 -alias bol
#   base64 -w0 bol.jks   # → ANDROID_KEYSTORE_BASE64
# Without the secrets the job still builds an UNSIGNED apk artifact (not
# installable) so you can verify the build.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # The action's default also asks for the legacy "tools" package, which the
          # current runner SDK no longer has (sdkmanager exits 1). The next step
          # installs everything the build needs.
          packages: platform-tools

      # The NDK is over 1 GB and pinned to one version below, so keep it between
      # runs; sdkmanager then finds it installed and skips the download.
      # Keep the version in the key in step with the sdkmanager line.
      - name: Cache Android NDK
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.1.12297006
          key: ndk-27.1.12297006-${{ runner.os }}

      # Gradle's dependency and wrapper caches. The Android project is generated at
      # build time, so key on what shapes it: the plugins' Gradle files and the
      # locked Tauri version.
      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('src-tauri/plugins/**/*.gradle*', 'src-tauri/plugins/**/gradle-wrapper.properties', 'src-tauri/Cargo.lock') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install NDK + build tools
        run: |
          sdkmanager "ndk;27.1.12297006" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.1.12297006" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - name: Rust + Android targets
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Init + build Android (unsigned APK)
        run: |
          pnpm tauri android init --ci
          # tauri-plugin-native-audio (background audio) requires Android 8.0+
          # (minSdk 26); the Tauri template defaults to 24, which fails the manifest
          # merger. Bump the freshly-scaffolded app module's minSdk.
          sed -i -E 's/(minSdk[[:space:]]*=[[:space:]]*)[0-9]+/\126/' src-tauri/gen/android/app/build.gradle.kts
          grep -n "minSdk" src-tauri/gen/android/app/build.gradle.kts || true
          # android init scaffolds gen/android with the DEFAULT Tauri icon.
          # Regenerate our app icon into the now-existing Android project so
          # the APK ships the real launcher icon (not the default swirl).
          pnpm tauri icon src-tauri/app-icon.png
          pnpm tauri android build --apk --target aarch64

      - name: Locate unsigned APK
        id: apk
        run: |
          APK=$(find src-tauri/gen/android -name '*-release-unsigned.apk' | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Found: $APK"

      # Android Auto only lists the app if these reach the final APK (they come from the
      # native-audio plugin's manifest, merged into the app's by Gradle).
      - name: Check Android Auto declarations in the APK
        run: |
          APK="${{ steps.apk.outputs.path }}"
          AAPT="$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > apk-manifest.txt
          grep -n -A3 -E 'car.application|MediaBrowserService|MediaLibraryService|NativeAudioService|CarArtworkProvider|nativeaudio.artwork' apk-manifest.txt
          for want in com.google.android.gms.car.application android.media.browse.MediaBrowserService \
                      androidx.media3.session.MediaLibraryService app.tauri.nativeaudio.CarArtworkProvider; do
            grep -q "$want" apk-manifest.txt || { echo "::error::$want missing from the APK manifest"; exit 1; }
          done
          DESC=$("$AAPT" dump --values resources "$APK" | grep -A2 'automotive_app_desc' | grep -oE 'res/[^"]+\.xml' | head -1)
          echo "automotive_app_desc -> $DESC"
          [ -n "$DESC" ] || { echo "::error::automotive_app_desc.xml missing from the APK"; exit 1; }
          "$AAPT" dump xmltree "$APK" "$DESC" | tee automotive.txt
          grep -q '"media"' automotive.txt || { echo "::error::automotive_app_desc does not declare media"; exit 1; }

      - name: Sign APK
        id: sign
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.jks
          BT="$ANDROID_SDK_ROOT/build-tools/34.0.0"
          # Tags (v1.2.3) have no slash, but a workflow_dispatch on a branch does
          # (feat/x) — sanitise it so the output filename isn't a nonexistent dir.
          OUT=bread-of-life-${GITHUB_REF_NAME//\//-}.apk
          OUT=${OUT:-bread-of-life-dev.apk}
          "$BT/zipalign" -p -f 4 "${{ steps.apk.outputs.path }}" aligned.apk
          "$BT/apksigner" sign --ks release.jks \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out "$OUT" aligned.apk
          "$BT/apksigner" verify "$OUT"
          echo "signed=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bread-of-life-apk
          path: |
            ${{ steps.sign.outputs.signed || steps.apk.outputs.path }}

      # Robolectric tests for the native audio plugin (Media3 session + service on the JVM).
      # After the upload so a test failure still leaves the APK to inspect, and before the
      # release step so a tag never ships with failing tests.
      - name: Native audio plugin tests
        working-directory: src-tauri/gen/android
        run: |
          PROJECT=$(grep -oE "':[^']*native-audio[^']*'" tauri.settings.gradle | head -1 | tr -d "'")
          if [ -z "$PROJECT" ]; then
            echo "native-audio plugin project not found in tauri.settings.gradle:"; cat tauri.settings.gradle; exit 1
          fi
          echo "Testing $PROJECT"
          ./gradlew "$PROJECT:testDebugUnitTest" --console=plain

      # The car's generated artwork tiles (CarArtworkSamplesTest), to look at.
      - name: Upload Android Auto artwork samples
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-auto-artwork
          path: src-tauri/plugins/native-audio/android/build/car-artwork-samples/
          if-no-files-found: ignore

      - name: Upload plugin test report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-audio-test-report
          path: src-tauri/plugins/native-audio/android/build/reports/tests/

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/') && steps.sign.outputs.signed != ''
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: ${{ steps.sign.outputs.signed }}
          fail_on_unmatched_files: true
