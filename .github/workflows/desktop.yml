name: Desktop

# Builds native desktop bundles for Linux, Windows, and macOS and attaches
# them to the GitHub Release for the tag. Runs alongside the Android workflow.
#
# Trigger: push a tag like `v0.1.0`, or run manually.
#
# NOTE (beta): Windows and macOS builds are currently UNSIGNED.
#   - Windows: SmartScreen may warn ("More info" → "Run anyway").
#   - macOS:   Gatekeeper blocks unsigned apps — right-click → Open, or run
#              `xattr -dr com.apple.quarantine "/Applications/Bread of Life.app"`.
# Proper code-signing (Apple Developer ID + notarization, Windows cert) is
# tracked in docs/ROADMAP.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: "appimage,deb"
            rust_target: ""
          - os: windows-latest
            bundles: "nsis"
            rust_target: ""
          - os: macos-latest
            bundles: "dmg"
            rust_target: "universal-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: System deps (Linux only)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libappindicator3-dev patchelf file libxdo-dev libssl-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Rust
        run: rustup toolchain install stable --profile minimal

      - name: Extra Rust targets (macOS universal)
        if: matrix.rust_target == 'universal-apple-darwin'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}

      - run: pnpm install --frozen-lockfile

      - name: Build bundles
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
        shell: bash
        run: |
          if [ -n "${{ matrix.rust_target }}" ]; then
            pnpm tauri build --target ${{ matrix.rust_target }} --bundles ${{ matrix.bundles }}
          else
            pnpm tauri build --bundles ${{ matrix.bundles }}
          fi

      # The AppImage that Tauri/linuxdeploy produces bundles the ubuntu-22.04
      # build machine's (old) WebKitGTK, which clashes with the newer system
      # WebKit on rolling distros (Arch/EndeavourOS) → blank window. Strip the
      # bundled WebKit/JSC so the AppImage uses the host's system webkit2gtk-4.1
      # like the .deb/AUR already do. The .deb is left untouched.
      - name: Unbundle WebKit from AppImage (Linux only)
        if: matrix.os == 'ubuntu-22.04'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        shell: bash
        run: |
          chmod +x scripts/appimage-unbundle-webkit.sh
          scripts/appimage-unbundle-webkit.sh

      - name: Collect bundles
        shell: bash
        run: |
          mkdir -p out
          find src-tauri/target -type f \
            \( -name '*.AppImage' -o -name '*.deb' -o -name '*.dmg' \
               -o -name '*-setup.exe' -o -name '*.msi' \) \
            -exec cp {} out/ \; 2>/dev/null || true
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: bread-of-life-${{ matrix.os }}
          path: out/*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*

  # Publish the new version to the AUR (bread-of-life-bin). That package is a separate
  # repo holding just a PKGBUILD, and it repackages the .deb the job above attaches —
  # so this has to wait for the release assets to exist (`needs: build`). Historically
  # this was a manual step and the AUR drifted a release behind.
  #
  # Setup (one-off): add an AUR_SSH_PRIVATE_KEY secret holding a private key whose
  # public half is registered on the AUR account. Without it this job cleanly no-ops,
  # so forks and unconfigured repos are unaffected.
  aur:
    name: Publish to AUR
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # makepkg/updpkgsums are Arch tools; run them on Arch rather than reimplementing.
    container: archlinux:base-devel
    steps:
      - name: Is the AUR key configured?
        id: gate
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -n "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AUR_SSH_PRIVATE_KEY is not set — skipping the AUR publish."
          fi

      - name: Install tools
        if: steps.gate.outputs.enabled == 'true'
        run: pacman -Syu --noconfirm --needed git openssh pacman-contrib

      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'

      - name: Configure SSH for aur.archlinux.org
        if: steps.gate.outputs.enabled == 'true'
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          # The host key is PINNED, not trust-on-first-use: a release that pushes
          # itself must not accept whatever key answers on the day. Verify against the
          # fingerprints the AUR publishes before ever editing this line.
          #   SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4
          cat > ~/.ssh/known_hosts <<'EOF'
          aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN
          EOF
          chmod 600 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host aur.archlinux.org
            User aur
            IdentityFile ~/.ssh/aur
            IdentitiesOnly yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Bump the PKGBUILD and push
        if: steps.gate.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          git config --global --add safe.directory '*'
          git clone ssh://aur@aur.archlinux.org/bread-of-life-bin.git /tmp/aur

          # makepkg refuses to run as root, so the bump runs as an unprivileged user.
          useradd -m builder
          cp scripts/bump-aur.sh /tmp/bump-aur.sh
          chmod +x /tmp/bump-aur.sh
          chown -R builder:builder /tmp/aur /tmp/bump-aur.sh
          sudo -u builder git config --global --add safe.directory '*'
          sudo -u builder git config --global user.name "Matt Shearing"
          sudo -u builder git config --global user.email "matt@block-sense.io"
          sudo -u builder /tmp/bump-aur.sh "$VERSION" /tmp/aur

          # The script no-ops when the AUR is already at this version (a re-run of a
          # release), so only push when it actually produced a commit.
          if [ -n "$(git -C /tmp/aur log origin/master..HEAD --oneline)" ]; then
            git -C /tmp/aur push origin master
            echo "::notice::Published bread-of-life-bin $VERSION to the AUR."
          else
            echo "::notice::AUR already at $VERSION — nothing pushed."
          fi
