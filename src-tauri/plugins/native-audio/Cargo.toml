[package]
name = "tauri-plugin-native-audio"
version = "1.0.5"
edition = "2021"
rust-version = "1.77.2"
build = "build.rs"
links = "tauri-plugin-native-audio"
description = "Bread of Life's Android audio (Media3 + Android Auto): a vendored fork of tauri-plugin-native-audio 1.0.5"
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/matt-shearing/bread-of-life"

[lib]
name = "tauri_plugin_native_audio"
path = "src/lib.rs"

[dependencies]
tauri = { version = "2.10.2", features = [] }

[build-dependencies]
tauri-plugin = { version = "2.5.3", features = ["build"] }
