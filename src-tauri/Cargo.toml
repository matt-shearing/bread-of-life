[package]
name = "bread-of-life"
version = "0.5.0"
description = "A warm, offline-first homebase for Bible reading, prayer, and journalling."
authors = ["Matt Shearing"]
edition = "2021"

[lib]
name = "bread_of_life_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-http = "2.5.9"
tauri-plugin-opener = "2.5.4"
tauri-plugin-notification = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2.7.1"

# Desktop audio playback OUTSIDE the webview. WebKitGTK plays <audio> through GStreamer,
# and a host missing gst-plugins-good aborts the whole web process instead of failing the
# element — see src/desktop_audio.rs and docs/DESKTOP.md. rodio drives cpal, which talks
# to ALSA / CoreAudio / WASAPI directly. Scoped to non-mobile targets so nothing new
# reaches the Android/iOS dependency graph.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rodio = { version = "0.22.2", default-features = false, features = [
    "playback",
    "symphonia-mp3",
    "symphonia-wav",
    "symphonia-pcm",
] }
percent-encoding = "2"

# Media keys and the desktop's media widget for the Rust player: MPRIS over D-Bus. WebKitGTK
# publishes MPRIS only for an <audio> element that plays, and none does on Linux. The dbus
# backend links the libdbus that tao already needs. See src/media_keys.rs.
[target.'cfg(target_os = "linux")'.dependencies]
souvlaki = { version = "0.8.3", default-features = false, features = ["use_dbus"] }

# Android "All files access" (MANAGE_EXTERNAL_STORAGE) bridge — a proper Kotlin
# Tauri plugin (see plugins/all-files). Android-only; lets the app read the Missler
# library in place from Downloads / any shared-storage folder once granted.
[target.'cfg(target_os = "android")'.dependencies]
# Native background audio: Media3 ExoPlayer in a MediaLibraryService, the lock screen,
# earphone buttons and Android Auto. A vendored fork of tauri-plugin-native-audio 1.0.5,
# since rewritten for this app (Android only; the upstream iOS half was removed). Desktop
# keeps its own Rust player. See plugins/native-audio and docs/NATIVE-AUDIO.md.
tauri-plugin-native-audio = { path = "plugins/native-audio" }
tauri-plugin-all-files = { path = "plugins/all-files" }
# Reading-reminder glue (see plugins/reminders): exact-alarm permissions in its
# manifest, and the notification tap that cold-started the app. Android-only.
tauri-plugin-reminders = { path = "plugins/reminders" }
# The phone's own text-to-speech voice rendered to a WAV (see plugins/device-tts): the
# fallback for a spoken devotional whose recording is not available. Android-only.
tauri-plugin-device-tts = { path = "plugins/device-tts" }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
